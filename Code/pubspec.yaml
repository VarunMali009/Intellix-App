name: offline_qwen_chat
description: ChatGPT-style chatbot that runs Qwen3 fully offline on the phone.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # flutter_gemma was renamed to flutter_edge_ai; upgrade both together.
  flutter_edge_ai: ^2.7.2
  flutter_edge_ai_litertlm: ^1.21.2
  shared_preferences: ^2.5.3 # saves chat history on the phone

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
